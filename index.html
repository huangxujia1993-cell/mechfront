<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="机械前沿 MechFront - 每天从全球信源收集 AI × 机械设计的最新动态，双评分精选、事件聚簇、按独立来源计算热度">
<title>机械前沿 MechFront · AI 正在重塑机械设计</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<style>
:root{
  --ink:#0c1a2b; --steel:#1e3a5f; --blue:#2563eb; --blue-dark:#1d4ed8;
  --orange:#f97316; --orange-dark:#ea580c;
  --text:#334155; --muted:#64748b; --line:#e2e8f0; --bg:#f6f8fb; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  --shadow:0 2px 10px rgba(12,26,43,.06); --shadow-lg:0 16px 40px -16px rgba(12,26,43,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);background:var(--bg);line-height:1.75;font-size:15px}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* ===== 顶栏 ===== */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{height:60px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;color:var(--ink);flex:none}
.logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--steel),var(--blue));display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.35)}
.logo small{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em}
nav.main{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{padding:7px 13px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;transition:.15s}
nav.main a:hover{background:#eef2f9;color:var(--blue-dark)}
nav.main a.active{background:var(--ink);color:#fff}
.searchbox{display:flex;align-items:center;background:#eef2f9;border:1.5px solid transparent;border-radius:999px;padding:6px 14px;gap:8px;flex:none;width:210px;transition:.2s}
.searchbox:focus-within{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.searchbox input{border:0;outline:0;background:transparent;font-size:13.5px;width:100%;font-family:inherit;color:var(--ink)}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;font-size:15px;transition:.15s;flex:none}
.icon-btn:hover{border-color:var(--blue);color:var(--blue-dark)}

/* ===== 头部横幅 ===== */
.hero{
  position:relative;border-bottom:1px solid var(--line);overflow:hidden;
  background:linear-gradient(180deg,#f0f5fc, var(--bg) 90%);
}
.hero::before{
  content:"";position:absolute;inset:0;opacity:.55;
  background-image:linear-gradient(rgba(37,99,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.07) 1px,transparent 1px);
  background-size:26px 26px;
}
.hero::after{content:"";position:absolute;top:-80px;right:-60px;width:340px;height:340px;border-radius:50%;background:radial-gradient(closest-side,rgba(249,115,22,.13),transparent)}
.hero-in{position:relative;padding:34px 0 26px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb b{color:var(--orange-dark);font-weight:700}
.hero h1{font-size:clamp(20px,3vw,28px);color:var(--ink);font-weight:800;letter-spacing:-.01em}
.hero .sub{font-size:14px;color:var(--muted);margin-top:6px;max-width:760px}

/* ===== 布局 ===== */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:28px;padding:28px 0 60px}
@media(max-width:1020px){.layout{grid-template-columns:1fr}}

/* ===== 标签页 ===== */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:7px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--text);transition:.15s}
.tab:hover{border-color:var(--blue)}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}

/* ===== 精选卡片 ===== */
.feed{display:grid;gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  transition:.18s;box-shadow:var(--shadow);position:relative
}
.card:hover{border-color:rgba(37,99,235,.4);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.src-tag{display:inline-flex;align-items:center;gap:5px;background:#eef2f9;padding:2px 10px;border-radius:999px;font-weight:600;color:var(--steel)}
.src-tag.tier-official{background:#e7f2ec;color:#15803d}
.src-tag.tier-community{background:#fdf1e5;color:#b45309}
.time{font-family:var(--mono);font-size:12px}
.score-badge{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--blue-dark);background:rgba(37,99,235,.09);padding:2px 9px;border-radius:999px}
.card h3{font-size:16.5px;line-height:1.5;color:var(--ink);font-weight:700}
.card h3 a::after{content:"";position:absolute;inset:0}
.card .summary{font-size:14px;margin-top:6px}
.card .reason{font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.card .reason::before{content:"为什么入选 · ";font-weight:700;color:var(--orange-dark)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;background:#f1f5f9;color:#475569;position:relative;z-index:2}
.chip.cat{background:rgba(37,99,235,.08);color:var(--blue-dark)}
.progress-tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--warn);background:#fdf6e7;border:1px solid #f3e2b8;padding:2px 9px;border-radius:999px}
.event-link{position:relative;z-index:2;font-size:12.5px;font-weight:700;color:var(--blue-dark)}
.event-link:hover{text-decoration:underline}

/* ===== 侧栏 ===== */
.aside{display:grid;gap:18px;align-content:start;position:sticky;top:76px}
@media(max-width:1020px){.aside{position:static}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel h2{font-size:14.5px;color:var(--ink);padding:14px 18px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel h2 .bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--orange),#fbbf24)}
.hot-list li{border-top:1px solid #f1f5f9}
.hot-list li a{display:flex;gap:12px;padding:11px 16px;transition:.15s;align-items:flex-start}
.hot-list li a:hover{background:#f8fafc}
.rank{font-family:var(--mono);font-weight:800;font-size:15px;color:#cbd5e1;width:22px;flex:none;padding-top:1px}
.hot-list li:nth-child(1) .rank{color:var(--orange)}
.hot-list li:nth-child(2) .rank{color:#f59e0b}
.hot-list li:nth-child(3) .rank{color:#fbbf24}
.hot-list .t{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.5}
.hot-list .h{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.heat-num{font-family:var(--mono);color:var(--orange-dark);font-weight:700}
.trend{font-size:10.5px;font-weight:800;padding:0 6px;border-radius:999px}
.trend.up{background:#dcfce7;color:#15803d}
.trend.new{background:#ffedd5;color:#c2410c}
.trend.flat{background:#f1f5f9;color:#64748b}
.panel .more{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--blue-dark);padding:11px;border-top:1px solid #f1f5f9}
.panel .more:hover{background:#f8fafc}
.side-item{padding:12px 18px;border-top:1px solid #f1f5f9;font-size:13.5px}
.side-item b{color:var(--ink)}
.side-item .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.side-item a.b{font-weight:700;color:var(--blue-dark)}
.side-item a.b:hover{text-decoration:underline}

/* ===== 页面标题 ===== */
.page-head{margin-bottom:20px}
.page-head h1{font-size:clamp(20px,3vw,26px);color:var(--ink);font-weight:800}
.page-head p{font-size:14px;color:var(--muted);margin-top:4px}

/* ===== 事件页 ===== */
.event-hero{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:14px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:20px}
.event-hero .cat-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px}
.event-hero h1{font-size:clamp(19px,2.8vw,25px);color:var(--ink);font-weight:800;line-height:1.5}
.event-hero .overview{margin-top:12px;font-size:14.5px;color:var(--text)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat-pill{background:#f1f5f9;border-radius:10px;padding:8px 14px;font-size:12.5px;color:var(--muted)}
.stat-pill b{color:var(--ink);font-family:var(--mono);font-size:14px}
.stat-pill b.hot{color:var(--orange-dark)}
.timeline{margin:22px 0 8px;border-left:2px solid #e2e8f0;padding-left:20px;display:grid;gap:12px}
.timeline .tl{position:relative}
.timeline .tl::before{content:"";position:absolute;left:-26px;top:7px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--orange)}
.timeline .tl .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.timeline .tl b{display:block;font-size:14px;color:var(--ink)}
.section-title{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);font-weight:800;margin:26px 0 14px}
.section-title::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--blue)}
.related{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* ===== 报告页 ===== */
.report-card{cursor:pointer}
.report-card .r-meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center;margin-bottom:8px}
.r-type{font-size:11px;font-weight:800;padding:2px 10px;border-radius:999px}
.r-type.daily{background:#e0eaff;color:#1d4ed8}
.r-type.weekly{background:#dcfce7;color:#15803d}
.r-type.monthly{background:#fdf1e5;color:#b45309}
.report-intro{background:linear-gradient(135deg,#12233b,#1e3a5f);color:#dbe7f5;border-radius:14px;padding:24px 26px;margin-bottom:22px;box-shadow:var(--shadow-lg)}
.report-intro h1{color:#fff;font-size:20px;margin-bottom:8px}
.report-intro .d{font-family:var(--mono);font-size:12.5px;color:#9db4d0;margin-bottom:10px}
.report-intro p{font-size:14.5px}

/* ===== 主题页 ===== */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.topic-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.15s;box-shadow:var(--shadow)}
.topic-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.topic-card b{color:var(--ink);font-size:15px}
.topic-card .n{font-size:12.5px;color:var(--muted);margin-top:4px}
.topic-card .n b{color:var(--orange-dark);font-family:var(--mono);font-size:14px}

/* ===== 搜索 ===== */
.search-page .big{width:100%;padding:15px 20px;border-radius:14px;border:2px solid var(--line);font-size:16px;font-family:inherit;outline:0;transition:.2s;background:#fff}
.search-page .big:focus{border-color:var(--blue);box-shadow:0 0 0 5px rgba(37,99,235,.1)}
mark{background:#fef08a;color:inherit;border-radius:3px;padding:0 2px}
.mode-row{display:flex;gap:8px;margin:14px 0}
.mode-btn{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.mode-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== 关于页 ===== */
.about-sec{margin-bottom:34px}
.about-sec h2{font-size:18px;color:var(--ink);font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.about-sec h2::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--orange)}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:900px){.pipeline{grid-template-columns:repeat(3,1fr)}}
.pipe-step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;position:relative}
.pipe-step .no{font-family:var(--mono);font-weight:800;color:var(--orange-dark);font-size:12px}
.pipe-step b{display:block;color:var(--ink);font-size:14px;margin:4px 0 3px}
.pipe-step small{font-size:11.5px;color:var(--muted);line-height:1.5;display:block}
.river{display:grid;gap:10px}
.river-group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.river-group h3{font-size:14px;color:var(--ink);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.river-group h3 .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600}
.river .items{display:flex;flex-wrap:wrap;gap:8px}
.river .src{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--steel)}
.river .src small{font-weight:500;color:var(--muted)}
.river .src.off{opacity:.45;text-decoration:line-through}
.table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.table th{background:#f1f5f9;text-align:left;padding:10px 14px;color:var(--ink);font-size:12.5px}
.table td{padding:9px 14px;border-top:1px solid #f1f5f9}
.code-box{background:#0c1a2b;color:#cde3f8;border-radius:12px;padding:18px 20px;font-family:var(--mono);font-size:13px;line-height:1.9;overflow-x:auto}
.code-box .c{color:#64748b}

/* ===== 页脚 ===== */
footer{border-top:1px solid var(--line);background:#fff;padding:30px 0;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer a{font-weight:600;color:var(--steel)}
footer a:hover{color:var(--blue-dark)}

/* ===== 通用 ===== */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--blue-dark);margin-bottom:14px}
.back:hover{text-decoration:underline}
.grid-cards{display:grid;gap:14px}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
</style>
</head>

<script src="config/site.js"></script>

<script src="config/selection.js"></script>
<script src="config/sources.js"></script>
<script src="data/news-data.js"></script>
<script>
/* ================= 工具 ================= */
const $ = (s, el) => (el || document).querySelector(s);
const D = window.NEWS_DATA, TAX = window.TAXONOMY, SITE = window.SITE, SEL = window.SELECTION, SRC = window.SOURCES;
const NOW = new Date(D.generatedAt);
const CAT = Object.fromEntries(TAX.categories.map(c => [c.key, c]));
const ALL_ITEMS = D.events.flatMap(e => e.items.map(i => ({ ...i, event: e })));
const ITEM_INDEX = Object.fromEntries(ALL_ITEMS.map(i => [i.id, i]));

const esc = s => String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const hl = (s, q) => { if (!q) return esc(s); try { return esc(s).replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); } catch (e) { return esc(s); } };
const pDate = s => new Date(s);
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
function fmtDate(s) { const d = pDate(s); return `${d.getMonth() + 1}月${d.getDate()}日`; }
function fmtDateFull(s) { const d = pDate(s); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function fmtTime(s) { const d = pDate(s); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function fmtDT(s) { return `${fmtDate(s)} ${fmtTime(s)}`; }
function tierName(t) { return SEL.tiers[t] ? SEL.tiers[t].label : t; }

/* ================= 热度算法（按事件：48h 窗口，独立来源只计一次，24h 内满权） ================= */
function eventHeat(e) {
  const seen = {};
  let heat = 0;
  for (const it of e.items) {
    const hours = (NOW - pDate(it.publishedAt)) / 36e5;
    if (hours < 0 || hours >= SEL.heat.windowHours) continue;
    if (seen[it.sourceId]) continue;
    seen[it.sourceId] = 1;
    heat += hours <= SEL.heat.freshHours ? SEL.heat.perSource : SEL.heat.perSource * 0.5;
  }
  const srcCount = Object.keys(seen).length;
  let trend = "flat";
  const firstHours = (NOW - pDate(e.firstSeen)) / 36e5;
  if (heat > 0 && firstHours < SEL.heat.freshHours) trend = "new";
  else if (heat > (e.prevHeat || 0) * 1.4 && heat > 0) trend = "up";
  return { heat: Math.round(heat * 10) / 10, srcCount, trend, totalSources: new Set(e.items.map(i => i.sourceId)).size };
}
const EVENTS_WITH_HEAT = D.events
  .map(e => ({ e, h: eventHeat(e) }))
  .sort((a, b) => b.h.heat - a.h.heat || pDate(b.e.lastSeen) - pDate(a.e.lastSeen));

/* ================= 组件 ================= */
function cardHTML(it, q) {
  const e = it.event;
  const progress = it.role === "progress" ? `<span class="progress-tag">⟳ 后续进展</span>` : "";
  return `<article class="card fade">
    <div class="meta">
      <span class="src-tag tier-${it.tier}">${esc(it.sourceName)}</span>
      <span class="time">${fmtDT(it.publishedAt)}</span>
      ${progress}
      <span class="score-badge" title="双评分（模型A / 模型B），门槛见关于页">A ${it.scoreA} · B ${it.scoreB}</span>
    </div>
    <h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${hl(it.title, q)}</a></h3>
    <p class="summary">${hl(it.summary, q)}</p>
    <p class="reason">${hl(it.reason, q)}</p>

/* ================= 路由 ================= */
function parseHash() {
  const raw = location.hash.slice(2) || "";
  const [path, queryStr] = raw.split("?");
  const params = new URLSearchParams(queryStr || "");
  const parts = path.split("/").filter(Boolean);
  return { parts, params };
}

function route() {
  const { parts, params } = parseHash();
  let routeKey = "home", html = "";
  const p0 = parts[0] || "home";
  if (p0 === "home") { routeKey = "home"; html = pageHome(); }
  else if (p0 === "hot") { routeKey = "hot"; html = pageHot(); }
  else if (p0 === "featured") { routeKey = "featured"; html = pageFeatured(params.get("cat")); }
  else if (p0 === "event") { routeKey = "event"; html = pageEvent(parts[1]); }
  else if (p0 === "reports") { routeKey = "reports"; html = pageReports(); }
  else if (p0 === "report") { routeKey = "report"; html = pageReport(parts[1]); }
  else if (p0 === "topics") { routeKey = "topics"; html = pageTopics(); }
  else if (p0 === "topic") { routeKey = "topic"; html = pageTopic(parts[1]); }
  else if (p0 === "search") { routeKey = "search"; html = pageSearch(params.get("q"), params.get("mode") || "title"); }
  else if (p0 === "about") { routeKey = "about"; html = pageAbout(); }
  else { html = pageHome(); }

  renderHero(routeKey);
  $("#app").innerHTML = html;
  document.querySelectorAll("nav.main a").forEach(a => a.classList.toggle("active", a.dataset.route === routeKey));
  window.scrollTo({ top: 0 });
  const big = $("#searchBig");
  if (big) { big.focus(); big.addEventListener("keydown", ev => { if (ev.key === "Enter") location.hash = `#/search?q=${encodeURIComponent(big.value)}&mode=${params.get("mode") || "title"}`; }); }
}

window.addEventListener("hashchange", route);
$("#searchInput").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.value.trim()) location.hash = `#/search?q=${encodeURIComponent(ev.target.value.trim())}`;
});

/* ================= 初始化 ================= */
$("#logoName").innerHTML = `${esc(SITE.name)} <small>${esc(SITE.nameEn.toUpperCase())}</small>`;
$("#footerText").textContent = SITE.footer;
route();
</script>

name: LLM 流水线

on:
  schedule:
    - cron: "50 23 * * *" # 北京时间每天 07:50（07:30 采集之后）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    # 未配置 DEEPSEEK_API_KEY Secret 时自动跳过（不报错）
    if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 运行流水线（预筛 → 双评分 → 写作 → 聚簇 → 成刊）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/run-pipeline.mjs

      - name: 重新生成 RSS / API
        run: node scripts/build-exports.mjs

      - name: 提交结果
        run: |
          git config user.name "mechfront-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ api/ rss.xml config/sources.js
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(pipeline): 流水线处理（$(TZ=Asia/Shanghai date '+%m-%d %H:%M') 北京时间）"
            git push
          fi
